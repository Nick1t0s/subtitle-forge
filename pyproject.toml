[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-forge"
version = "0.1.0"
description = "Modular word-timed ASS subtitle generator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
subtitle-forge = "subtitle_forge.cli:main"

[tool.setuptools.packages.find]
include = ["subtitle_forge*"]
